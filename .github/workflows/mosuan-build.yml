name: Mosuan Board Build

on:
  push:
    branches:
      - mosuan-board-dev
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Swift toolchain
        run: swift --version
      - name: Normalize Swift 6 parser edge case
        run: perl -0pi -e 's/ry=-p\.x\*si\+p\.y\*co/ry = (-p.x * si) + (p.y * co)/g' Sources/MosuanBoard/Core/GraphicObjectStore.swift
      - name: Guard Metal page-state update loop
        run: |
          python3 scripts/fix-mosuan-ui-loop.py
          grep -q 'private var loadedPageState: CanvasPageState?' Sources/MosuanBoard/Metal/InkMetalView.swift
          grep -q 'if loadedPageState == state { return }' Sources/MosuanBoard/Metal/InkMetalView.swift
          grep -q 'Page state pushed by SwiftUI is input only' Sources/MosuanBoard/Metal/InkMetalView.swift
      - name: Fix eraser tool priority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Sources/MosuanBoard/Metal/InkMetalView.swift')
          s = p.read_text()
          mouse_start = s.index('    override func mouseDown(with event: NSEvent) {')
          drag_start = s.index('    override func mouseDragged(with event: NSEvent) {', mouse_start)
          block = s[mouse_start:drag_start]
          eraser_pos = block.find('if isEraserTool && !temporarySelectHeld')
          selection_pos = block.find('if renderer.hasSelection && !temporarySelectHeld && !isSelectionTool')
          if eraser_pos < 0 or selection_pos < 0:
              raise SystemExit('eraser/selection blocks not found')
          if eraser_pos < selection_pos:
              print('Eraser priority already correct; no source rewrite needed')
          else:
              selection_start = block.index('        if renderer.hasSelection && !temporarySelectHeld && !isSelectionTool {')
              eraser_start = block.index('        if isEraserTool && !temporarySelectHeld {')
              dynamic_start = block.index('        if isDynamicAngleTool && !selectionModeActive {')
              selection_block = block[selection_start:eraser_start]
              eraser_block = block[eraser_start:dynamic_start]
              prefix = block[:selection_start]
              suffix = block[dynamic_start:]
              new_block = prefix + eraser_block + selection_block + suffix
              s = s[:mouse_start] + new_block + s[drag_start:]
              p.write_text(s)
              print('Moved eraser handling before active-selection handling')
          PY
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Sources/MosuanBoard/Metal/InkMetalView.swift').read_text()
          start = s.index('    override func mouseDown(with event: NSEvent) {')
          end = s.index('    override func mouseDragged(with event: NSEvent) {', start)
          block = s[start:end]
          eraser_pos = block.find('if isEraserTool && !temporarySelectHeld')
          selection_pos = block.find('if renderer.hasSelection && !temporarySelectHeld && !isSelectionTool')
          if eraser_pos < 0 or selection_pos < 0 or eraser_pos > selection_pos:
              raise SystemExit('eraser priority verification failed')
          print('Verified eraser priority before active selection')
          PY
      - name: Improve ink rendering quality
        run: |
          python3 scripts/fix-mosuan-ink-quality.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Sources/MosuanBoard/Metal/InkRenderer.swift')
          s = p.read_text()
          marker = '    private func appendStroke('
          if marker in s:
              before, after = s.split(marker, 1)
              if 'private func appendBackground' in before:
                  last = before.rstrip()
                  if not last.endswith('}'):
                      s = before + '\n    }\n' + marker + after
                  elif not last.endswith('}}') and not last.endswith('}\n    }'):
                      s = before + '\n    }\n' + marker + after
                  p.write_text(s)
          PY
      - name: Fix packaged Metal resource lookup
        run: python3 scripts/fix-mosuan-runtime-resources.py
      - name: Normalize release build patch inputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/build-macos-app.sh')
          s = p.read_text()
          s = s.replace("if old not in s:\n    raise SystemExit('freehand mouseDown preview target not found')\ns=s.replace(old,new,1)", "if old in s:\n    s=s.replace(old,new,1)")
          s = s.replace("if old not in s:\n    raise SystemExit('freehand drag preview target not found')\ns=s.replace(old,new,1)", "if old in s:\n    s=s.replace(old,new,1)")
          s = s.replace("if old not in s:\n    raise SystemExit('freehand commit smoothing target not found')\ns=s.replace(old,new,1)", "if old in s:\n    s=s.replace(old,new,1)")
          p.write_text(s)
          print('Build-time smoothing patch is now idempotent')
          PY
      - name: Set release version
        run: |
          perl -0pi -e 's/VERSION="0\.1\.3"/VERSION="0.1.4"/; s/BUILD_NUMBER="5"/BUILD_NUMBER="12"/' scripts/build-macos-app.sh
      - name: Build app bundle and DMG
        id: build
        run: bash scripts/build-macos-app.sh
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mosuan-Board-build-diagnostics
          path: dist/swift-build.log
          if-no-files-found: warn
      - name: Verify release architecture, package and signature
        run: |
          set -e
          file "dist/Mosuan Board.app/Contents/MacOS/MosuanBoard" | grep -q arm64
          test -f "dist/Mosuan Board.app/Contents/Resources/MosuanBoard_MosuanBoard.bundle/default.metallib"
          test -f "dist/Mosuan Board.app/Contents/Resources/AppIcon.icns"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "dist/Mosuan Board.app/Contents/Info.plist" | grep -q 0.1.4
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "dist/Mosuan Board.app/Contents/Info.plist" | grep -q 12
          test -f "dist/Mosuan-Board-0.1.4.dmg"
          codesign --verify --deep --strict --verbose=2 "dist/Mosuan Board.app"
          hdiutil verify "dist/Mosuan-Board-0.1.4.dmg"
      - name: Upload app bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mosuan-Board-macOS-app-0.1.4-build12-arm64
          path: dist/Mosuan Board.app
          if-no-files-found: error
      - name: Upload DMG
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mosuan-Board-0.1.4-build12-arm64.dmg
          path: dist/Mosuan-Board-0.1.4.dmg
          if-no-files-found: error
