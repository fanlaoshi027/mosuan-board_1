name: Flutter Desktop CI

on:
  push:
    branches: [flutter-a-dev]
  pull_request:
    branches: [flutter-a-dev]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Generate desktop platform projects
        run: flutter create --platforms=linux .
      - name: Remove generated sample test
        run: rm -rf test
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: |
          if [ -d test ]; then flutter test; else echo "No test directory; skipping tests."; fi

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      - name: Generate macOS project
        run: flutter create --platforms=macos .
      - name: Install native macOS pressure bridge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('macos/Runner/AppDelegate.swift')
          text = path.read_text()

          # Flutter's generated AppDelegate has changed its plugin-registration
          # spelling across releases. Match either form instead of depending on
          # one historical marker.
          markers = [
              'RegisterGeneratedPlugins(registry: flutterViewController)',
              'GeneratedPluginRegistrant.register(with: flutterViewController)',
          ]
          marker = next((m for m in markers if m in text), None)
          if marker is None:
              raise SystemExit('Could not locate Flutter plugin registration in AppDelegate.swift')

          bridge = r'''

          // Pressure-only bridge. AppKit's NSEvent carries normalized pressure
          // for tablet/pressure events; positions stay in Flutter's pointer path.
          final class NativePressureBridge: NSObject, FlutterStreamHandler {
            static let shared = NativePressureBridge()
            private var sink: FlutterEventSink?
            private var monitor: Any?

            func attach(to messenger: FlutterBinaryMessenger) {
              let channel = FlutterEventChannel(name: "mosuan/native_pressure", binaryMessenger: messenger)
              channel.setStreamHandler(self)
            }

            func onListen(withArguments arguments: Any?, eventSink events: @escaping FlutterEventSink) -> FlutterError? {
              sink = events
              startMonitoring()
              return nil
            }

            func onCancel(withArguments arguments: Any?) -> FlutterError? {
              stopMonitoring()
              sink = nil
              return nil
            }

            private func startMonitoring() {
              guard monitor == nil else { return }
              monitor = NSEvent.addLocalMonitorForEvents(matching: [.tabletPoint, .pressure]) { [weak self] event in
                self?.handle(event)
                return event
              }
            }

            private func stopMonitoring() {
              if let monitor = monitor {
                NSEvent.removeMonitor(monitor)
                self.monitor = nil
              }
            }

            private func handle(_ event: NSEvent) {
              guard event.type == .tabletPoint || event.type == .pressure else { return }
              let pressure = min(max(Double(event.pressure), 0.0), 1.0)
              sink?(["pressure": pressure])
            }
          }
          '''

          attach = marker + '\n              NativePressureBridge.shared.attach(to: flutterViewController.engine.binaryMessenger)'
          text = text.replace(marker, attach, 1)
          if 'final class NativePressureBridge:' not in text:
              text += bridge
          path.write_text(text)
          PY
      - name: Pub get
        run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release
      - name: Create test DMG
        shell: bash
        run: |
          mkdir -p build/dmg
          hdiutil create \
            -volname "墨写测试版" \
            -srcfolder "build/macos/Build/Products/Release/" \
            -ov \
            -format UDZO \
            "build/dmg/墨写-测试版.dmg"
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: mosuan-board-macos-dmg
          path: flutter/build/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Generate Windows project
        run: flutter create --platforms=windows .
      - name: Pub get
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
